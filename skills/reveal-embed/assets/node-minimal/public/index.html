<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal dashboard</title>
    <style>
        /* RevealView fills its container, so the container needs a real height. */
        html, body, #revealView { width: 100%; height: 100%; margin: 0; }
    </style>
</head>
<body>
    <div id="revealView"></div>

    <script type="module">
        // Pin the version, and keep it in step with the server package. With a bundler, import
        // the same names from the "reveal-sdk" npm package instead.
        import { RevealView, RevealSdkSettings, RVDashboard } from "https://cdn.jsdelivr.net/npm/reveal-sdk@2.2.1/dist/reveal-sdk.esm.js";

        // Same origin, but the server mounts Reveal under /reveal-api/ (keep the trailing slash).
        RevealSdkSettings.setBaseUrl(`${location.origin}/reveal-api/`);

        // Opens dashboards/Sales.rdash, the sample; ?dashboard=<name> loads dashboards/<name>.rdash.
        // ?new opens an empty dashboard in the editor. It offers no data sources until the server
        // maps one and the page adds it in revealView.onDataSourcesRequested (references/data-sources.md).
        const params = new URLSearchParams(location.search);
        const name = params.has("new") ? null : params.get("dashboard") || "Sales";
        const revealView = new RevealView("#revealView");

        if (name) {
            try {
                revealView.dashboard = await RVDashboard.loadDashboard(name);
            } catch (err) {
                // Typical first-run causes: 401 (no authentication wired up yet, or start with
                // --anonymous-demo) or a missing .rdash. See the server console and network tab.
                const msg = document.createElement("p");
                msg.textContent = `Could not load dashboard "${name}": ${err?.message ?? err}`;
                document.body.prepend(msg);
            }
        } else {
            revealView.startInEditMode = true;
            revealView.dashboard = new RVDashboard();
        }
    </script>
</body>
</html>
