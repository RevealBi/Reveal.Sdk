server.port=5111
# Localhost only; SERVER_ADDRESS=0.0.0.0 to reach it from outside a container.
server.address=127.0.0.1
# No login in this sample: anyone who can open it can view dashboards. Set to false once the
# app has login (wired into SecurityConfig).
reveal.allow-anonymous=true
# View only: saves are refused. true lets each user save into their own folder.
reveal.allow-editing=false
# Folder of shared dashboards, never written; with allow-editing, users save under
# <dir>/users/<sha256 of user id>/. Relative paths resolve against the working directory:
# start the app from its folder, or use an absolute path in production.
reveal.dashboards-dir=Dashboards
# Set only when the front end is served from another origin (e.g. https://app.example.com).
reveal.client-origin=
