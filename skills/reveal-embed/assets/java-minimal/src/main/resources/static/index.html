<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal dashboard</title>
    <style>
        /* RevealView fills its container, so the container needs a real height. */
        html, body, #revealView { width: 100%; height: 100%; margin: 0; }
    </style>
</head>
<body>
    <div id="revealView"></div>

    <script type="module">
        // Pin the version, and keep it in step with reveal.version in pom.xml.
        import { RevealView, RVDashboard, RevealSdkSettings } from "https://cdn.jsdelivr.net/npm/reveal-sdk@2.2.1/dist/reveal-sdk.esm.js";

        // The servlet is mapped at /reveal-api/*, so the client needs that prefix.
        RevealSdkSettings.setBaseUrl(location.origin + "/reveal-api/");
        // Spring Security's CSRF token (see SecurityConfig): Reveal POSTs get 403 without it.
        RevealSdkSettings.setAdditionalHeadersProvider(() => {
            const token = document.cookie.split("; ").find(c => c.startsWith("XSRF-TOKEN="))?.slice(11);
            return token ? { "X-XSRF-TOKEN": decodeURIComponent(token) } : {};
        });

        // Pass ?dashboard=<name> to load Dashboards/<name>.rdash; with none, an empty
        // dashboard opens in the editor. It offers no data sources until the server maps one
        // and the page adds it in revealView.onDataSourcesRequested (references/data-sources.md).
        const name = new URLSearchParams(location.search).get("dashboard");
        const revealView = new RevealView("#revealView");

        if (name) {
            try {
                revealView.dashboard = await RVDashboard.loadDashboard(name);
                document.body.dataset.loaded = "true";
            } catch (err) {
                // Typical first-run causes: 401 (no authentication wired up yet, or start with
                // --anonymous-demo) or a missing .rdash. See the server console and network tab.
                const msg = document.createElement("p");
                msg.textContent = `Could not load dashboard "${name}": ${err?.message ?? err}`;
                document.body.prepend(msg);
                document.body.dataset.loaded = "error";
            }
        } else {
            revealView.startInEditMode = true;
            revealView.dashboard = new RVDashboard();
            document.body.dataset.loaded = "true";
        }
    </script>
</body>
</html>
